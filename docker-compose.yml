# Stack della demo: OpenFGA (datastore in memoria) e il backend .NET 8.
# Porte host: OpenFGA 8180, backend 5180 (la 8080 e la 3000 restano libere).
name: openfga-oltre-i-ruoli

services:
  openfga:
    image: openfga/openfga:v1.22.1
    command: run --playground-enabled=false
    ports:
      - "8180:8080"

  backend:
    build: ./backend
    environment:
      OPENFGA__APIURL: http://openfga:8080
      OPENFGA__STOREID: ${FGA_STORE_ID:-}
      AUTHZ__SOURCEOFTRUTH: ${AUTHZ__SOURCEOFTRUTH:-rbac}
      # Chiave di sviluppo, pubblica: serve solo a firmare i token di prova.
      JWT__DEVKEY: dev-only-hs256-key-not-a-secret-0123456789
    ports:
      - "5180:8080"
    depends_on:
      - openfga
